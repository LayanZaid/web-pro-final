<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>to do list</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>


  <header>
    <div class="container mt-5 pt-5">
      <h1 class="text-center mb-5">TODO input</h1>
     </div>
  </header>

  <main>
    <div class="container" >
      <form id="add-form" class="d-flex align-items-center gap-5 w-75 m-auto">
        <div class="w-100" style="border  :groove ; padding: 20px;">
          <input type="text" class="form-control" id="add-input" />
          <span class="text-small text-danger"></span><br>
          <button style="width: 100%;" type="submit" class="btn btn-info px-4">Add new task</button>
        </div>
      </form>

       <div class="container mt-5 pt-5">
      <h1 class="text-center mb-5">TODO list</h1>
<table style="   align-items: center; gap: 40px; margin: auto; width: 75%;">
  <thead>
    <tr>
     <div class="filter-buttons text-center mb-3">
      <th>  <button  onclick="filterTodos('all')" class="btn  btn-lg btn-info mx-1">All</button></th>
      <th>  <button onclick="filterTodos('done')" class="btn btn-info btn-lg mx-1">Done</button></th>
       <th> <button onclick="filterTodos('todo')" class="btn btn-info btn-lg mx-1">Todo</button></th>
      </tr>
</thead>
<tbody id="todos">
</tbody>

</table>

       <div class="footer-buttons text-center mt-4">
        <button class="btn btn-danger mx-2" onclick="deleteDoneTasks()">Delete Done Tasks</button>
        <button class="btn btn-dark mx-2" onclick="deleteAllTasks()">Delete All Tasks</button>

      </div>
    </div>
  </main>
     
    </div>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="js/script.js"></script>
  <script src="js/async.js"></script>
</body>

</html>
